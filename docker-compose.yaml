services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/app/
    links:
      - php
    networks:
      - pg-network
  
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    env_file:
      - .env
    ports:
      - "5433:5432"
    networks:
      - pg-network
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
  
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    volumes:
      - .:/app
      - php_vendor:/app/vendor
    networks:
      - pg-network
    depends_on:
      db:
        condition: service_healthy
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pg-admin2
    env_file:
      - .env
    ports:
      - "5050:80"
    networks:
      - pg-network

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: node
    working_dir: /app
    volumes:
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./public/assets/ts:/app/public/assets/ts
      - ./public/assets/js:/app/public/assets/js
      - node_modules:/app/node_modules
    restart: unless-stopped
  
networks:
  pg-network:

volumes:
  pg_data:
  node_modules:
  php_vendor: