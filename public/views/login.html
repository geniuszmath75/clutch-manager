<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" initial-scale=1>
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="/public/assets/img/logo.svg">
    <link rel="stylesheet" href="/public/assets/css/auth.css" />
    <script src="https://kit.fontawesome.com/b36ff3dc2a.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-page__background"></div>

        <div class="auth-page__blur auth-page__blur--top-left"></div>
        <div class="auth-page__blur auth-page__blur--bottom-right"></div>

        <div class="auth-layout">
            <div class="auth-header">
                <div class="auth-header__logo">
                    <div class="logo">
                        <div class="logo__icon-wrapper">
                            <img src="/public/assets/img/logo.svg" alt="logo" class="logo__icon" />
                        </div>

                        <div class="logo__text">
                            <span class="logo__primary">Clutch</span>
                            <span class="logo__accent">Manager</span>
                        </div>
                    </div>
                </div>

                <h1 class="auth-header__title">
                    Login
                </h1>
            </div>


            <div class="auth-card">
                <form id="login-form" class="auth-form" novalidate>

                    <div id="login-error" class="modal-error" hidden></div>
                    <div id="login-success" class="modal-success" hidden></div>

                    <!-- EMAIL -->
                    <div class="form-field">
                        <label for="login-email" class="form-field__label">
                            Email Address
                        </label>

                        <div class="input-wrapper">
                            <div class="input-icon">
                                <i class="fas fa-envelope"></i>
                            </div>

                            <input id="login-email" type="email" name="email" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <!-- PASSWORD -->
                    <div class="form-field">
                        <label for="login-password" class="form-field__label">
                            Password
                        </label>

                        <div class="input-wrapper">
                            <div class="input-icon">
                                <i class="fa-solid fa-lock"></i>
                            </div>

                            <input id="login-password" type="password" name="password" placeholder="********" required autofocus>

                            <button type="button" class="input-action" id="login-toggle-password" aria-label="Toggle password visibility">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-submit" class="btn-accent">
                        <span class="btn-accent__label">Login</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-divider"></div>

                <div class="auth-footer">
                    <span class="auth-footer__text">
                        Don't have an account?
                    </span>

                    <a href="/auth/register" class="auth-footer__link">
                        Register
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

<script type="module" src="/public/assets/js/auth.js"></script>
</html>
